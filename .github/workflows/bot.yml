name: Marathon Saathi scanner

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      send_telegram:
        description: "Send new events to Telegram (leave false for scan-only)"
        type: boolean
        required: true
        default: false

permissions:
  contents: write

concurrency:
  group: marathon-saathi-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scan listings and notify Telegram only when manually enabled
        run: python bot.py
        env:
          DRY_RUN: ${{ github.event_name == 'schedule' || inputs.send_telegram != true }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Save duplicate history
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.send_telegram == true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "Update sent event history" && git push)
