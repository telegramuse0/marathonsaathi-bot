name: marathon-bot
on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      test_one:
        description: "true = ek event ka test draft banao"
        default: "false"
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 pillow
      - run: python bot.py
        env:
          DRY_RUN: "true"
          TEST_ONE: ${{ github.event.inputs.test_one }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      - name: Save changes
        run: |
          git config user.name "marathon-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "bot update" && git push)
 
